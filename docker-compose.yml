version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile-scalingo
    command: uv run gunicorn --config gunicorn_conf.py gesec.front.wsgi --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file: ../gesec.env
    environment:
      - DJANGO_SETTINGS_MODULE=gesec.settings
      - DATABASE_URL=postgres://thomas@host.docker.internal:5432/docia
      - UV_PROJECT_ENVIRONMENT=/venv
